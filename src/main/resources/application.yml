spring:
  application:
    name: LittlePayAssessment

  datasource:
    url: jdbc:postgresql://localhost:5432/trip
    username: appuser
    password: trip@2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop

server:
  port: 8080

app:
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
    user:
      username: ${USER_USERNAME:user}
      password: ${USER_PASSWORD:user123}
  fare:
    base-fare: 1.45
  seed:
    enabled: true
  upload:
    dir: ${UPLOAD_DIR:uploads}
    batch-size: 1000
  queue:
    file-stream: tap-files:uploaded
    dead-letter-stream: taps:dead
    consumer-group: tap-trips
    consumer-name: ${HOSTNAME:tap-trips-1}
  processing:
    cards-per-chunk: 1000

# springdoc-openapi (Swagger) configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator health check configuration (used by Docker healthchecks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
